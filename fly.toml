# Fly.io single-machine deployment.
#   fly launch --no-deploy --copy-config
#   fly secrets set SUPABASE_URL=... SUPABASE_KEY=... OPENAI_API_KEY=... \
#       REFLEX_DB_URL=... API_URL=https://<app>.fly.dev APP_BASE_URL=https://<app>.fly.dev
#   fly deploy
app = "inolas-messenger"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  BACKEND_PORT = "8000"
  # The Fly domain is known only after launch, so rebuild the frontend at boot.
  REFLEX_EXPORT_ON_START = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep at least one machine warm: this app holds per-user Reflex state in
  # memory and relies on a persistent WebSocket.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
