app = "inolas-messenger"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[build.args]
  API_URL = "https://inolas-messenger.fly.dev"
  APP_BASE_URL = "https://inolas-messenger.fly.dev"

[env]
  PORT = "8080"
  BACKEND_PORT = "8000"
  REFLEX_EXPORT_ON_START = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # State lives in-process: never stop the machine, keep one always running.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
