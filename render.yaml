# Render blueprint: one long-lived Docker web service (state + WebSockets).
services:
  - type: web
    name: inolas-messenger
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: PORT
        value: 8080
      - key: BACKEND_PORT
        value: 8000
      # Render only knows the public domain after the first deploy: set
      # API_URL/APP_BASE_URL to https://<service>.onrender.com, keep this at 1.
      - key: REFLEX_EXPORT_ON_START
        value: 1
      - key: API_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REFLEX_DB_URL
        sync: false
      - key: OAUTH_REDIRECT_URL
        sync: false
