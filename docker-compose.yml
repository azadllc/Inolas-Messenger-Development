# Local container test: http://localhost:8080
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:8080}
        APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    image: inolas-messenger:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      BACKEND_PORT: 8000
      API_URL: ${API_URL:-http://localhost:8080}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
